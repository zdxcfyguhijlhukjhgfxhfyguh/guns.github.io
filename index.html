<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuketown Sniper 1v1</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }

      .overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.7); color: #fff; font-family: 'Segoe UI', sans-serif;
        z-index: 100; cursor: pointer; user-select: none;
      }
      .overlay h1 { font-size: 48px; letter-spacing: 6px; margin-bottom: 16px; }
      .overlay p { font-size: 16px; color: #aaa; margin: 4px 0; }
      .overlay .sub { font-size: 13px; color: #666; margin-top: 20px; }

      .hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; font-family: 'Segoe UI', sans-serif; }

      .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
      .ch-h, .ch-v { position: absolute; background: rgba(255,255,255,0.8); }
      .ch-h { width: 20px; height: 1px; top: 0; }
      .ch-h.l { right: 6px; } .ch-h.r { left: 6px; }
      .ch-v { height: 20px; width: 1px; left: 0; }
      .ch-v.t { bottom: 6px; } .ch-v.b { top: 6px; }
      .ch-dot { position: absolute; width: 3px; height: 3px; background: red; border-radius: 50%; top: -1px; left: -1px; }

      .ammo-box {
        position: absolute; bottom: 30px; right: 30px;
        background: rgba(0,0,0,0.6); padding: 12px 20px; border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.15);
      }
      .ammo-box .label { font-size: 10px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
      .ammo-box .count { font-size: 36px; font-weight: bold; color: #fff; }
      .ammo-box .count.empty { color: #f44; }
      .ammo-box .reserve { font-size: 14px; color: #666; margin-left: 4px; }

      .health-box {
        position: absolute; bottom: 30px; left: 30px;
        background: rgba(0,0,0,0.6); padding: 12px 20px; border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.15);
      }
      .health-box .label { font-size: 10px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
      .health-bar { width: 200px; height: 6px; background: #333; border-radius: 3px; margin-top: 6px; }
      .health-fill { height: 100%; border-radius: 3px; background: #4caf50; transition: width 0.3s; }
      .health-fill.low { background: #f44; }
      .health-val { font-size: 14px; color: #fff; margin-top: 4px; }

      .score-box {
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 40px; background: rgba(0,0,0,0.5); padding: 10px 30px;
        border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
      }
      .score-side { text-align: center; }
      .score-side .who { font-size: 11px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
      .score-side .num { font-size: 28px; font-weight: bold; }
      .score-side .num.you { color: #4fc3f7; }
      .score-side .num.enemy { color: #f44; }
      .score-sep { font-size: 28px; color: #444; align-self: center; }

      .hitmarker {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        pointer-events: none; opacity: 0; transition: opacity 0.1s;
      }
      .hitmarker.show { opacity: 1; }
      .hitmarker svg { width: 24px; height: 24px; }

      .kill-banner {
        position: absolute; top: 35%; left: 50%; transform: translateX(-50%);
        font-size: 24px; font-weight: bold; color: #f44; letter-spacing: 4px;
        opacity: 0; transition: opacity 0.3s; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      }
      .kill-banner.show { opacity: 1; }

      .scope-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
      }
      .scope-crosshair-h {
        position: absolute; top: 50%; left: 0; width: 100%; height: 1px;
        background: rgba(0,0,0,0.5); transform: translateY(-0.5px);
      }
      .scope-crosshair-v {
        position: absolute; top: 0; left: 50%; width: 1px; height: 100%;
        background: rgba(0,0,0,0.5); transform: translateX(-0.5px);
      }
      .weapon-selector {
        position: absolute; bottom: 90px; right: 30px;
        display: flex; gap: 6px;
      }
      .weapon-slot {
        padding: 6px 12px; font-size: 12px; color: #666;
        background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 4px; letter-spacing: 1px;
      }
      .weapon-slot.active {
        color: #fff; border-color: rgba(255,255,255,0.4);
        background: rgba(255,255,255,0.08);
      }
      .weapon-key {
        font-weight: bold; margin-right: 4px; color: #c9a84c;
      }

      .scope-circle {
        position: absolute; top: 50%; left: 50%;
        width: 70vmin; height: 70vmin;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 2px solid rgba(0,0,0,0.4);
        box-shadow: 0 0 0 9999px rgba(0,0,0,0.85);
      }

      .game-over {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.85); z-index: 200; font-family: 'Segoe UI', sans-serif; color: #fff;
      }
      .game-over h1 { font-size: 64px; margin-bottom: 20px; }
      .game-over .result { font-size: 24px; margin-bottom: 30px; }
      .game-over .result.win { color: #4caf50; }
      .game-over .result.lose { color: #f44; }
      .game-over button {
        padding: 12px 40px; font-size: 18px; background: #fff; color: #000;
        border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      }
      .game-over button:hover { background: #ddd; }

      /* ===== MAIN MENU ===== */
      .main-menu {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 150; font-family: 'Segoe UI', sans-serif; color: #fff;
        user-select: none; transition: opacity 0.6s ease;
      }
      .main-menu.fade-out { opacity: 0; pointer-events: none; }

      .menu-panel {
        position: absolute; top: 0; left: 0; width: 480px; height: 100%;
        background: linear-gradient(to right, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.75) 70%, transparent 100%);
        display: flex; flex-direction: column; padding: 60px 50px;
        z-index: 2;
      }

      .menu-header { margin-bottom: 48px; }
      .menu-eyebrow {
        font-size: 11px; letter-spacing: 6px; color: #888;
        text-transform: uppercase; margin-bottom: 8px;
      }
      .menu-title {
        font-size: 56px; font-weight: 900; letter-spacing: 8px;
        line-height: 1; margin: 0;
        background: linear-gradient(180deg, #fff 40%, #b8a88a 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .menu-subtitle {
        font-size: 18px; font-weight: 400; letter-spacing: 10px;
        color: #c9a84c; margin-top: 6px;
      }
      .menu-divider {
        width: 60px; height: 2px; background: #c9a84c;
        margin-top: 20px; opacity: 0.6;
      }

      .menu-nav { display: flex; flex-direction: column; gap: 4px; }

      .menu-item {
        position: relative; display: flex; flex-direction: column;
        align-items: flex-start; padding: 14px 20px;
        background: transparent; border: none; color: #fff;
        cursor: pointer; font-family: inherit; text-align: left;
        transition: background 0.2s;
      }
      .menu-item:hover, .menu-item.active {
        background: rgba(255,255,255,0.06);
      }
      .menu-item-bar {
        position: absolute; left: 0; top: 0; width: 3px; height: 100%;
        background: #c9a84c; opacity: 0; transition: opacity 0.2s;
      }
      .menu-item:hover .menu-item-bar,
      .menu-item.active .menu-item-bar { opacity: 1; }

      .menu-item-text {
        font-size: 20px; font-weight: 700; letter-spacing: 4px;
      }
      .menu-item-desc {
        font-size: 11px; color: #777; letter-spacing: 1px; margin-top: 2px;
      }

      .controls-panel {
        margin-top: 8px; margin-left: 20px; margin-bottom: 8px;
        display: flex; flex-direction: column; gap: 8px;
        animation: slideIn 0.2s ease;
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .control-row {
        display: flex; justify-content: space-between; width: 260px;
        font-size: 13px; color: #aaa;
      }
      .control-row .key {
        font-weight: 700; color: #fff; letter-spacing: 1px;
        background: rgba(255,255,255,0.08); padding: 2px 10px;
        border-radius: 3px; font-size: 11px; min-width: 60px; text-align: center;
      }

      .menu-footer {
        margin-top: auto; display: flex; gap: 24px; flex-wrap: wrap;
      }
      .mode-badge {
        display: flex; flex-direction: column; gap: 2px;
      }
      .mode-label {
        font-size: 9px; color: #666; letter-spacing: 3px; text-transform: uppercase;
      }
      .mode-name {
        font-size: 13px; font-weight: 600; color: #c9a84c; letter-spacing: 2px;
      }

      /* Map selector */
      .map-selector {
        margin-top: 28px;
      }
      .map-selector-label {
        font-size: 10px; letter-spacing: 4px; color: #666;
        text-transform: uppercase; margin-bottom: 10px; padding-left: 20px;
      }
      .map-cards {
        display: flex; flex-direction: column; gap: 6px;
      }
      .map-card {
        position: relative; text-align: left; padding: 12px 20px;
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 4px; cursor: pointer; font-family: inherit; color: #fff;
        transition: all 0.2s;
      }
      .map-card:hover { background: rgba(255,255,255,0.06); }
      .map-card.selected { background: rgba(255,255,255,0.06); }
      .map-card-name {
        font-size: 15px; font-weight: 700; letter-spacing: 3px;
        transition: color 0.2s;
      }
      .map-card-sub {
        font-size: 10px; color: #666; letter-spacing: 2px; margin-top: 2px;
      }
      .map-card-desc {
        font-size: 11px; color: #555; margin-top: 4px; line-height: 1.3;
      }
      .map-card-check {
        position: absolute; top: 12px; right: 16px; font-size: 16px; font-weight: bold;
      }

      /* Floating particles */
      .menu-particles {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 1; overflow: hidden;
      }
      .particle {
        position: absolute; bottom: -10px;
        background: rgba(201,168,76,0.5); border-radius: 50%;
        animation: floatUp linear infinite;
      }
      @keyframes floatUp {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
